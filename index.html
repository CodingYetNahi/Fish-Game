<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0", maximum -scale=1.0, user-scalable=no>
 <title>Eat The Fish - Ocean Arcade</title>
 <style>
  :root {
    --bg: #06151d;
    --bg-2: #0b2932;
    --panel: rgba(8, 28, 37, 0.78);
    --panel-border: rgba(159, 232, 218, 0.22);
    --white: #f4fffc;
    --mint: #9fe8da;
    --coral: #ff9a83;
    --gold: #ffd166;
  }

  * { box-sizing: border-box; }

  body {
   margin: 0;
   padding: 0;
    background: radial-gradient(circle at 50% 0%, #164858 0, transparent 55%), linear-gradient(145deg, var(--bg), var(--bg-2));
   display: flex;
   justify-content: center;
   align-items: center;
  height: 100dvh;
   overflow: hidden;
   color: var(--white);
    font-family: Georgia, 'Times New Roman', serif;
  }

  .game-shell { position: relative; width: min(100vw, 900px, calc((100dvh - 24px) * 4 / 3)); }

  .brand {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--mint);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 14px;
    text-align: center;
    z-index: 11;
  }

  .brand strong { display: block; color: var(--white); font-size: 24px; letter-spacing: 0; }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 4 / 3;
    border: 2px solid rgba(159, 232, 218, 0.35);
    border-radius: 22px;
    background: linear-gradient(to bottom, #082a37, #06161e);
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35), 0 0 35px rgba(77, 207, 193, 0.12);
  cursor: none;
  touch-action: none;
  }

  .hud {
   position: absolute;
   z-index: 10;
    font-family: Arial, sans-serif;
    font-size: 15px;
   font-weight: bold;
   padding: 10px 14px;
   border-radius: 12px;
   background: var(--panel);
   border: 1px solid var(--panel-border);
    color: var(--white);
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.16);
  }

  #level-board {
   top: 18px;
   left: 20px;
  }

  #score-board {
   top: 18px;
   right: 20px;
    color: var(--gold);
  }

  #timer-board {
   left: 50%;
   bottom: 18px;
   transform: translateX(-50%);
   font-size: 18px;
    color: var(--mint);
  }

  #bonus-board { top: 78px; left: 18px; color: var(--coral); display: none; }

  #hint {
    position: absolute;
    right: 18px;
    bottom: 18px;
    color: rgba(244, 255, 252, 0.62);
    font: 13px Arial, sans-serif;
  }

  #pause-btn {
   position: absolute;
   right: 18px;
   top: 78px;
   z-index: 12;
   border: 1px solid var(--panel-border);
   border-radius: 10px;
   padding: 8px 12px;
  min-height: 44px;
   background: var(--panel);
   color: var(--white);
   font: bold 13px Arial, sans-serif;
   cursor: pointer;
  }

  #pause-menu, #settings-panel {
   position: absolute;
   left: 50%;
   top: 50%;
   transform: translate(-50%, -50%);
   z-index: 30;
   display: none;
   width: min(340px, calc(100vw - 40px));
   padding: 28px;
   border: 1px solid var(--panel-border);
   border-radius: 18px;
   background: rgba(6, 28, 36, 0.97);
   box-shadow: 0 20px 70px rgba(0, 0, 0, 0.5);
   text-align: center;
  }

  #pause-menu h2, #settings-panel h2 { margin: 0 0 18px; font-size: 28px; }

  .menu-button {
   display: block;
   width: 100%;
   margin: 9px 0;
  padding: 11px 15px;
  min-height: 44px;
   border: 1px solid var(--panel-border);
   border-radius: 10px;
   background: rgba(159, 232, 218, 0.1);
   color: var(--white);
   font: bold 14px Arial, sans-serif;
   cursor: pointer;
  }

  .menu-button.primary { background: var(--mint); color: #06232a; }

  .setting-row {
   display: flex;
   align-items: center;
   justify-content: space-between;
   margin: 18px 0;
   font: 14px Arial, sans-serif;
  }

  #status-banner {
   position: absolute;
   left: 50%;
   top: 50%;
   transform: translate(-50%, -50%);
   display: none;
    min-width: min(320px, calc(100vw - 40px));
    padding: 28px 24px;
   text-align: center;
    background: rgba(6, 28, 36, 0.96);
    border: 1px solid rgba(159, 232, 218, 0.3);
   border-radius: 18px;
    box-shadow: 0 20px 70px rgba(0, 0, 0, 0.4);
   z-index: 20;
  }

  #status-banner strong {
   display: block;
   font-size: 30px;
   margin-bottom: 8px;
   color: #ffffff;
  }

  #status-message {
   font-size: 16px;
    color: rgba(244, 255, 252, 0.75);
   margin-bottom: 12px;
  }

  #restart-btn {
    background: var(--mint);
   border: none;
   border-radius: 999px;
    color: #06232a;
   font-weight: bold;
   padding: 10px 18px;
   cursor: pointer;
  }

    @media (max-width: 620px) {
    .brand { top: 10px; font-size: 11px; }
     .brand strong { font-size: 20px; }
     .hud { padding: 8px 10px; font-size: 12px; }
    #level-board, #score-board { top: 58px; }
     #level-board { left: 12px; }
     #score-board { right: 12px; }
      #bonus-board { top: 104px; left: 12px; }
      #pause-btn { top: 104px; right: 12px; }
    #timer-board { bottom: 12px; }
    #hint { display: none; }
    canvas { border-radius: 16px; }
    }
 </style>
</head>
<body>
 <main class="game-shell">

 <div class="brand">Ocean arcade <strong>Eat The Fish</strong></div>
 <div id="level-board" class="hud">Level <span id="level">1</span> · Target <span id="target">10</span></div>
 <div id="score-board" class="hud">Score <span id="score">0</span></div>
 <div id="bonus-board" class="hud">Bonus +<span id="bonus">0</span></div>
 <div id="timer-board" class="hud">Time <span id="timer">30.0</span>s</div>
 <div id="hint">Move your pointer to hunt</div>
 <button id="pause-btn" type="button">Pause</button>

 <div id="pause-menu" role="dialog" aria-label="Pause menu">
  <h2>Paused</h2>
  <button id="resume-btn" class="menu-button primary" type="button">Resume</button>
  <button id="pause-restart-btn" class="menu-button" type="button">Restart</button>
  <button id="settings-btn" class="menu-button" type="button">Settings</button>
 </div>

 <div id="settings-panel" role="dialog" aria-label="Game settings">
  <h2>Settings</h2>
  <label class="setting-row" for="music-toggle">Ocean music <input id="music-toggle" type="checkbox" checked></label>
  <button id="settings-close-btn" class="menu-button primary" type="button">Done</button>
 </div>

 <div id="status-banner">
  <strong id="status-title">Game Over</strong>
  <div id="status-message">The shark missed the target.</div>
  <button id="restart-btn" type="button">Restart Game</button>
 </div>

 <canvas id="gameCanvas"></canvas>
 </main>

 <script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreElement = document.getElementById('score');
  const levelElement = document.getElementById('level');
  const targetElement = document.getElementById('target');
  const timerElement = document.getElementById('timer');
  const bonusBoard = document.getElementById('bonus-board');
  const bonusElement = document.getElementById('bonus');
  const statusBanner = document.getElementById('status-banner');
  const statusTitle = document.getElementById('status-title');
  const statusMessage = document.getElementById('status-message');
  const restartBtn = document.getElementById('restart-btn');
  const pauseBtn = document.getElementById('pause-btn');
  const pauseMenu = document.getElementById('pause-menu');
  const resumeBtn = document.getElementById('resume-btn');
  const pauseRestartBtn = document.getElementById('pause-restart-btn');
  const settingsBtn = document.getElementById('settings-btn');
  const settingsPanel = document.getElementById('settings-panel');
  const settingsCloseBtn = document.getElementById('settings-close-btn');
  const musicToggle = document.getElementById('music-toggle');

  canvas.width = 800;
  canvas.height = 600;

  let score = 0;
  let level = 1;
  let levelTarget = 10;
  let levelCaught = 0;
  let timer = 30;
  let gameActive = true;
  let timerInterval = null;
  let paused = false;
  let audioContext = null;
  let musicTimer = null;
  let musicStep = 0;

  const shark = {
   x: canvas.width / 2,
   y: canvas.height / 2,
    size: 30,
   speed: 0.1
  };

  const fishes = [];
  const maxFishes = 12;

  function updateHud() {
   scoreElement.textContent = score;
   levelElement.textContent = level;
   targetElement.textContent = levelTarget;
   timerElement.textContent = timer.toFixed(1);
  }

  function startTimer() {
   clearInterval(timerInterval);
   timerInterval = setInterval(() => {
    if (!gameActive) return;
    timer = Math.max(0, timer - 0.1);
    timerElement.textContent = timer.toFixed(1);
    if (timer <= 0) {
     endGame(false);
    }
   }, 100);
  }

  function setLevelSettings() {
    levelTarget = 10 + (level - 1) * 5;
    timer = getLevelTime();
   updateHud();
  }

    function getLevelTime() {
    return Math.min(90, 25 + levelTarget * 0.5);
    }

  function createFish() {
   const fish = {
    x: 0,
    y: 0,
    size: shark.size * (0.28 + Math.random() * 0.08),
    vx: (Math.random() - 0.5) * 2.6,
    vy: (Math.random() - 0.5) * 2.6,
    speed: 1.3 + Math.random() * 1.8,
    learning: 0.4 + Math.random() * 1.2,
    memoryX: canvas.width / 2,
    memoryY: canvas.height / 2,
    panic: 0
   };
    spawnFishAtEdge(fish);
    return fish;
    }

    function spawnFishAtEdge(fish, side = Math.random() < 0.5 ? 'left' : 'right') {
    const edgeOffset = fish.size * 3;
    fish.x = side === 'left' ? -edgeOffset : canvas.width + edgeOffset;
    fish.y = fish.size + Math.random() * (canvas.height - fish.size * 2);
    fish.vx = side === 'left' ? 1.4 + Math.random() * 1.2 : -1.4 - Math.random() * 1.2;
    fish.vy = (Math.random() - 0.5) * 2.2;
    fish.memoryX = canvas.width / 2;
    fish.memoryY = canvas.height / 2;
  }

  function populateFish() {
   fishes.length = 0;
   for (let i = 0; i < maxFishes; i++) {
    fishes.push(createFish());
   }
  }

  function resetGame() {
   score = 0;
   level = 1;
    levelCaught = 0;
    paused = false;
   setLevelSettings();
   gameActive = true;
   statusBanner.style.display = 'none';
    pauseMenu.style.display = 'none';
    settingsPanel.style.display = 'none';
    bonusBoard.style.display = 'none';
   shark.x = canvas.width / 2;
   shark.y = canvas.height / 2;
   populateFish();
   startTimer();
   updateHud();
  }

  function endGame(success) {
   gameActive = false;
   clearInterval(timerInterval);
    stopMusic();
    pauseMenu.style.display = 'none';
    settingsPanel.style.display = 'none';
   statusBanner.style.display = 'block';

    if (success) {
     statusTitle.textContent = 'Ocean Master!';
     statusMessage.textContent = `You cleared all 100 levels with a score of ${score}.`;
    } else {
    statusTitle.textContent = 'Game Over';
    statusMessage.textContent = `You reached level ${level}. Final score: ${score}.`;
   }
  }

  function setPaused(nextPaused) {
   if (!gameActive && !paused) return;
   paused = nextPaused;
   gameActive = !paused;
   pauseMenu.style.display = paused ? 'block' : 'none';
   pauseBtn.textContent = paused ? 'Paused' : 'Pause';
   if (paused) stopMusic();
   else if (musicToggle.checked) startMusic();
  }

  function startMusic() {
   if (!musicToggle.checked || musicTimer) return;
   audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
   audioContext.resume();
   const notes = [220, 277.18, 329.63, 415.3, 329.63, 277.18];
   musicTimer = setInterval(() => {
    if (!gameActive || !musicToggle.checked) return;
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    oscillator.type = 'sine';
    oscillator.frequency.value = notes[musicStep++ % notes.length];
    gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.035, audioContext.currentTime + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.7);
    oscillator.connect(gain).connect(audioContext.destination);
    oscillator.start();
    oscillator.stop(audioContext.currentTime + 0.75);
   }, 850);
  }

  function stopMusic() {
   clearInterval(musicTimer);
   musicTimer = null;
  }

  function advanceLevel() {
    if (level >= 100) return;
   level += 1;
    levelCaught = 0;
     levelTarget = 10 + (level - 1) * 5;
    timer = getLevelTime();
   populateFish();
   gameActive = true;
   updateHud();
  }

  function updateFish(fish) {
   const dx = shark.x - fish.x;
   const dy = shark.y - fish.y;
   const dist = Math.hypot(dx, dy) || 1;
   const danger = Math.max(0, 1 - dist / 260);

   fish.memoryX += (shark.x - fish.memoryX) * 0.08;
   fish.memoryY += (shark.y - fish.memoryY) * 0.08;

   let biasX = 0;
   let biasY = 0;

   if (dist < 220) {
    const fleeX = -dx / dist;
    const fleeY = -dy / dist;

    const memoryDx = fish.memoryX - fish.x;
    const memoryDy = fish.memoryY - fish.y;
    const memoryDist = Math.hypot(memoryDx, memoryDy) || 1;

    const memoryFleeX = memoryDx / memoryDist;
    const memoryFleeY = memoryDy / memoryDist;

    biasX += fleeX * (2.2 + danger * 4.0) + memoryFleeX * (0.8 + fish.learning * 1.0);
    biasY += fleeY * (2.2 + danger * 4.0) + memoryFleeY * (0.8 + fish.learning * 1.0);
    fish.panic = Math.min(1.5, fish.panic + 0.08 + danger * 0.12);
   } else {
    fish.panic *= 0.92;
    biasX += (canvas.width / 2 - fish.x) * 0.0007;
    biasY += (canvas.height / 2 - fish.y) * 0.0007;
   }

   const targetSpeed = fish.speed + fish.learning * 0.8 + fish.panic * 0.9;
   fish.vx += biasX * 0.12;
   fish.vy += biasY * 0.12;

   const currentSpeed = Math.hypot(fish.vx, fish.vy) || 1;
   if (currentSpeed > targetSpeed) {
    fish.vx = (fish.vx / currentSpeed) * targetSpeed;
    fish.vy = (fish.vy / currentSpeed) * targetSpeed;
   }

   fish.x += fish.vx;
   fish.y += fish.vy;

  if (fish.y < fish.size || fish.y > canvas.height - fish.size) {
   fish.y = Math.max(fish.size, Math.min(canvas.height - fish.size, fish.y));
   fish.vy *= -1;
  }

  if (fish.x < -fish.size * 3) {
   spawnFishAtEdge(fish, 'left');
  } else if (fish.x > canvas.width + fish.size * 3) {
   spawnFishAtEdge(fish, 'right');
   }
  }

  function drawFish(fish) {
   const dx = shark.x - fish.x;
   const dy = shark.y - fish.y;
   const dist = Math.hypot(dx, dy);
   const nearShark = dist < 160;

  const direction = fish.vx >= 0 ? 1 : -1;
  const bodyLength = fish.size * 1.45;
  const bodyHeight = fish.size * 0.72;

  ctx.save();
  ctx.translate(fish.x, fish.y);
  ctx.scale(direction, 1);
  ctx.fillStyle = nearShark ? `rgba(255, 156, 204, ${0.7 + (160 - dist) / 220})` : '#f1f1f1';
  ctx.strokeStyle = nearShark ? '#ffb8d9' : '#d7d7d7';
  ctx.lineWidth = 1.2;

  ctx.beginPath();
  ctx.moveTo(bodyLength, 0);
  ctx.quadraticCurveTo(bodyLength * 0.35, -bodyHeight, -bodyLength * 0.7, -bodyHeight * 0.42);
  ctx.quadraticCurveTo(-bodyLength, 0, -bodyLength * 0.7, bodyHeight * 0.42);
  ctx.quadraticCurveTo(bodyLength * 0.35, bodyHeight, bodyLength, 0);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(-bodyLength * 0.05, -bodyHeight * 0.35);
  ctx.lineTo(-bodyLength * 0.28, -fish.size * 0.95);
  ctx.lineTo(bodyLength * 0.2, -bodyHeight * 0.25);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(-bodyLength * 0.05, bodyHeight * 0.35);
  ctx.lineTo(-bodyLength * 0.25, fish.size * 0.95);
  ctx.lineTo(bodyLength * 0.2, bodyHeight * 0.25);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(-bodyLength * 0.55, 0);
  ctx.lineTo(-bodyLength * 1.22, -fish.size * 0.7);
  ctx.lineTo(-bodyLength * 1.22, fish.size * 0.7);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#17343b';
  ctx.beginPath();
  ctx.arc(bodyLength * 0.58, -bodyHeight * 0.18, Math.max(1.5, fish.size * 0.11), 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  }

  function checkCollision() {
   for (let i = fishes.length - 1; i >= 0; i--) {
    const fish = fishes[i];
    const dist = Math.hypot(shark.x - fish.x, shark.y - fish.y);

    if (dist < shark.size) {
     fishes.splice(i, 1);
     score += 1;
    levelCaught += 1;
     updateHud();

    if (levelCaught >= levelTarget) {
      const bonus = 25 + level * 10;
      score += bonus;
      updateHud();
      bonusElement.textContent = bonus;
      bonusBoard.style.display = 'block';
      setTimeout(() => { bonusBoard.style.display = 'none'; }, 1200);
      if (level >= 100) {
       endGame(true);
      } else {
       advanceLevel();
      }
      return;
     }

     if (fishes.length < maxFishes) {
      fishes.push(createFish());
     }
    }
   }
  }

  function drawShark() {
   ctx.save();
   ctx.translate(shark.x, shark.y);

   const angle = Math.atan2(mouseY - shark.y, mouseX - shark.x);
   ctx.rotate(angle);

    const bodyLength = shark.size * 1.9;
    const bodyHeight = shark.size * 0.82;
    ctx.fillStyle = '#f2f2f2';
    ctx.beginPath();
    ctx.moveTo(bodyLength, 0);
    ctx.quadraticCurveTo(bodyLength * 0.35, -bodyHeight, -bodyLength * 0.72, -bodyHeight * 0.45);
    ctx.quadraticCurveTo(-bodyLength, 0, -bodyLength * 0.72, bodyHeight * 0.45);
    ctx.quadraticCurveTo(bodyLength * 0.35, bodyHeight, bodyLength, 0);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#eeeeee';
    ctx.beginPath();
    ctx.moveTo(-shark.size * 0.25, bodyHeight * 0.32);
    ctx.lineTo(-shark.size * 0.8, shark.size * 1.4);
    ctx.lineTo(shark.size * 0.15, bodyHeight * 0.28);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-shark.size * 0.2, -bodyHeight * 0.32);
    ctx.lineTo(-shark.size * 0.7, -shark.size * 1.3);
    ctx.lineTo(shark.size * 0.18, -bodyHeight * 0.28);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-bodyLength * 0.65, 0);
    ctx.lineTo(-bodyLength * 1.35, -shark.size * 0.58);
    ctx.lineTo(-bodyLength * 1.35, shark.size * 0.58);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#101010';
    ctx.beginPath();
    ctx.arc(bodyLength * 0.55, -bodyHeight * 0.24, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(bodyLength * 0.55, bodyHeight * 0.24, 3, 0, Math.PI * 2);
    ctx.fill();

   ctx.restore();
  }

  let mouseX = canvas.width / 2;
  let mouseY = canvas.height / 2;

  function updatePointer(event) {
   const rect = canvas.getBoundingClientRect();
   mouseX = (event.clientX - rect.left) * canvas.width / rect.width;
   mouseY = (event.clientY - rect.top) * canvas.height / rect.height;
  }

  canvas.addEventListener('pointermove', updatePointer);
  canvas.addEventListener('pointerdown', updatePointer);

  document.addEventListener('pointerdown', () => {
   if (gameActive && musicToggle.checked) startMusic();
  }, { once: true });

  pauseBtn.addEventListener('click', () => setPaused(true));
  resumeBtn.addEventListener('click', () => setPaused(false));
  pauseRestartBtn.addEventListener('click', () => {
   resetGame();
   startMusic();
  });
  settingsBtn.addEventListener('click', () => {
   pauseMenu.style.display = 'none';
   settingsPanel.style.display = 'block';
  });
  settingsCloseBtn.addEventListener('click', () => {
   settingsPanel.style.display = 'none';
   pauseMenu.style.display = paused ? 'block' : 'none';
  });
  musicToggle.addEventListener('change', () => {
   if (musicToggle.checked && !paused && gameActive) startMusic();
   else stopMusic();
  });

  function gameLoop() {
   ctx.clearRect(0, 0, canvas.width, canvas.height);

   if (gameActive) {
    shark.x += (mouseX - shark.x) * shark.speed;
    shark.y += (mouseY - shark.y) * shark.speed;
   }

   fishes.forEach((fish) => {
    if (gameActive) updateFish(fish);
    drawFish(fish);
   });

  if (gameActive) checkCollision();
   drawShark();

   requestAnimationFrame(gameLoop);
  }

  restartBtn.addEventListener('click', () => {
   resetGame();
    startMusic();
  });

  resetGame();
  gameLoop();
 </script>
</body>
</html>
